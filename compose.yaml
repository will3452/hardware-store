services:
  database:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: hardware_store
      MYSQL_USER: hardware_store
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/docker/create-testing-database.sql:/docker-entrypoint-initdb.d/10-testing.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
